# mint-macos: Linux Mint directo, sin menú ni texto (Ventoy conf_replace, 10-11-2026). El ISO va en
# modo GRUB2 por el «.vtgrub2» del nombre: en la MacBook5,1 el modo normal no arranca.
# Sale del /boot/grub/grub.cfg del ISO 22.3: mismas entradas, mismo uuid de casper.
#
# nomodeset en la de siempre: con la NVIDIA 9400M (MacBook5,1) el Mint en vivo se queda en
# pantalla negra con el cursor fijo si nouveau toma el video (10-11-2026). Para instalar basta
# el video del firmware; el sistema instalado sí usa nouveau.
# El menú no se ve: Esc en los 2 segundos lo enseña, con el modo de compatibilidad del ISO.
set timeout=2
set timeout_style=hidden
set default=0
menuentry "Linux Mint 22.3 Cinnamon" --class linuxmint {
	set gfxpayload=keep
	linux	/casper/vmlinuz  boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} quiet splash nomodeset loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 --
	initrd	/casper/initrd.lz
}
menuentry "Linux Mint 22.3 Cinnamon (compatibility mode)" {
	linux	/casper/vmlinuz  boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} noapic noacpi nosplash irqpoll nomodeset --
	initrd	/casper/initrd.lz
}
