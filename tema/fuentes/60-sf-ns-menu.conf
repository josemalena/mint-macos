<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- La SF de la Mac (SFNS.ttf, variable) con el grado que macOS usa en la
       interfaz de Catalina: GRAD 620. Mismo ancho, más cuerpo. Pango y St
       dejan el grado en 400 si nadie lo pide, y por CSS no se puede pedir.
       (mint-macos/tema; medido contra las capturas de la Mac, 10-10-2026.)

       «.SF NS Menú» es un nombre para los menús de la barra; desde que José
       pidió el grado «en todo», «.SF NS» también lo lleva. -->
  <match target="pattern">
    <test name="family"><string>.SF NS Menú</string></test>
    <edit name="family" mode="assign" binding="strong"><string>.SF NS</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>.SF NS</string></test>
    <edit name="fontvariations" mode="append"><string>GRAD=620</string></edit>
  </match>
</fontconfig>
