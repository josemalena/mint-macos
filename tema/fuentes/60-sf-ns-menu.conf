<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- «.SF NS Menú»: la SF variable con el grado de los menús de Catalina
       (GRAD 620; mint-macos/tema). Mismo ancho, más cuerpo. -->
  <match target="pattern">
    <test name="family"><string>.SF NS Menú</string></test>
    <edit name="family" mode="assign" binding="strong"><string>.SF NS</string></edit>
    <edit name="fontvariations" mode="append"><string>GRAD=620</string></edit>
  </match>
</fontconfig>
