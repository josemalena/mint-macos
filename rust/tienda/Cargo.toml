[package]
name = "mint-macos-tienda"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "El motor del App Store: catálogos de AppStream, PackageKit y Flatpak por D-Bus (org.mintmacos.Tienda1), sin ventana"

[dependencies]
# La misma zbus que el registrador (5.19, MIT) y lo que ya trae con ella.
zbus = "5.19"
futures-lite = "2.6"
# quick-xml 0.42.0 (22-08-2026, MIT): el catálogo de Flathub (appstream.xml).
quick-xml = "0.42.0"
# yaml-rust2 0.13.0 (11-09-2026, MIT o Apache-2.0): el catálogo de APT (DEP-11).
yaml-rust2 = "0.13.0"
# flate2 1.1.10 (28-08-2026, MIT o Apache-2.0): los catálogos vienen en .gz.
flate2 = "1.1.10"
# ureq 3.4.2 (13-09-2026, MIT o Apache-2.0): la API de Flathub y la de ODRS, por
# https con rustls; sin tokio.
ureq = "3.4.2"
# serde_json 1.0.151 (20-07-2026, MIT o Apache-2.0): las respuestas de esas API.
serde_json = "=1.0.151"
# serde (MIT o Apache-2.0), ya en el árbol por zbus: los argumentos de PackageKit.
serde = { version = "1.0.228", features = ["derive"] }
# blocking 1.7.0 (MIT o Apache-2.0), ya en el árbol por zbus: lo que lee la red sin
# trabar el bus.
blocking = "1.7.0"
