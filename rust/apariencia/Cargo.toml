[package]
name = "mint-macos-apariencia"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Light, Dark y Auto, el color de acento y el de resaltado (org.mintmacos.Apariencia1): cambian el tema Constanza activo"

[dependencies]
# La misma zbus que los otros servicios (5.19, MIT), con su API bloqueante.
zbus = "5.19"
serde = { version = "1.0.228", features = ["derive"] }
# serde_json 1.0.151, la misma de tienda (MIT o Apache-2.0).
serde_json = "=1.0.151"
