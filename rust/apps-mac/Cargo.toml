[package]
name = "mint-macos-apps-mac"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Las .app de Mac sin .desktop (org.mintmacos.AppsMac1): nombre, clase de ventana e íconos para el Launchpad, el Muelle y Fynder"

[dependencies]
# La misma zbus que los otros servicios (5.19, MIT), con su API bloqueante.
zbus = "5.19"
# Leer las .app, los PNG del .icns y mac-abiertas, igual que abrir-mac.
comun = { package = "mint-macos-comun", path = "../comun" }
