[package]
name = "mint-macos-calendario"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Los eventos del calendario de Thunderbird para el widget Calendar del Notification Center (org.mintmacos.Calendario1), en solo lectura"

[dependencies]
zbus = "5.19"
# El SQLite de Thunderbird se lee de una copia; «bundled» porque no hay libsqlite3-dev.
rusqlite = { version = "0.32", features = ["bundled"] }
# Las recurrencias con un crate probado (RRULE, EXDATE; Planner, 18-10-2026), no a mano.
rrule = "0.14"
chrono = "0.4"
chrono-tz = "0.10"
inotify = { version = "0.11", default-features = false }
