# keyd: el teclado de Linux con los atajos de macOS.
# ⌘ es la tecla Super y ⌥ es Alt. Va en /etc/keyd/default.conf.
#
# En la capa [meta], una tecla con regla manda SOLO su regla (⌘C sale
# como Ctrl+C, sin Super), y las que no tienen regla siguen saliendo con
# Super. Por eso ⌘Tab, ⌘⇧Q, ⌘⇧4, ⌘⇧5, ⌘Espacio y ⌘1…9 llegan intactos a
# Cinnamon. Shift sigue sumándose: ⌘⇧Z sale como Ctrl+Shift+Z.
#
# ⌘Q sale como Ctrl+Q, pero ⌘⇧Q (cerrar sesión) y ⌘⌃Q (bloquear) siguen
# llegando como Super a Cinnamon: lo resuelven las capas compuestas del
# final. Sin ellas, ⌘⇧Q saldría como Ctrl+Shift+Q y cerraría el navegador.
#
# Fuera a propósito:
#   h, m   reservadas para ocultar y minimizar desde Cinnamon.
#
# Kitty recibe ⌘ y ⌥ sin traducir (ver app.conf): sus atajos cmd+… y
# opt+… siguen en el kitty.conf.
#
# Si algo se traba: Backspace+Escape+Enter a la vez mata keyd.

[ids]
*

[meta]
a = C-a
q = C-q
b = C-b
c = C-c
d = C-d
e = C-e
f = C-f
g = C-g
i = C-i
j = C-j
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
r = C-r
s = C-s
t = C-t
u = C-u
v = C-v
w = C-w
x = C-x
y = C-y
z = C-z
slash = C-slash
comma = C-comma
equal = C-equal
minus = C-minus
0 = C-0
# ⌘← ⌘→ inicio y fin de línea; ⌘↑ ⌘↓ inicio y fin del documento.
# Con Shift seleccionan, como en macOS.
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home backspace)

[alt]
# ⌥← ⌥→ por palabra y ⌥⌫ borra la palabra anterior.
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# Las capas compuestas van después de las capas que las forman.
[meta+shift]
q = M-S-q

[meta+control]
q = M-C-q
