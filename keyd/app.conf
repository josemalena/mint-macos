# keyd-application-mapper: excepciones por aplicación sobre default.conf.
# Va en ~/.config/keyd/app.conf. La clase es la de WM_CLASS en
# minúsculas (wmctrl -lx), p. ej. kitty, code, microsoft-edge.

# kitty maneja ⌘ y ⌥ por su cuenta (kitty_mod cmd y los opt+… del
# kitty.conf): aquí se les devuelve la tecla tal cual, sin traducir.
[kitty]
meta.a = M-a
meta.q = M-q
meta.b = M-b
meta.c = M-c
meta.d = M-d
meta.e = M-e
meta.f = M-f
meta.g = M-g
meta.i = M-i
meta.j = M-j
meta.k = M-k
meta.l = M-l
meta.n = M-n
meta.o = M-o
meta.p = M-p
meta.r = M-r
meta.s = M-s
meta.t = M-t
meta.u = M-u
meta.v = M-v
meta.w = M-w
meta.x = M-x
meta.y = M-y
meta.z = M-z
meta.slash = M-slash
meta.comma = M-comma
meta.equal = M-equal
meta.minus = M-minus
meta.0 = M-0
meta.left = M-left
meta.right = M-right
meta.up = M-up
meta.down = M-down
meta.backspace = M-backspace
alt.left = A-left
alt.right = A-right
alt.backspace = A-backspace
alt.delete = A-delete

# Chromium y Edge salen con Ctrl+Shift+Q, no con Ctrl+Q.
[microsoft-edge]
meta.q = C-S-q

[google-chrome]
meta.q = C-S-q
