# Keybindings estilo macOS
# En Linux, `cmd` representa la tecla Super (⌘ en un teclado Apple) y
# `opt` representa Alt/Option (⌥).
kitty_mod cmd

map cmd+enter new_window
map cmd+t new_tab
map cmd+w close_window
map cmd+left previous_tab
map cmd+right next_tab
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab

# Navegación y borrado por palabras, como en macOS.
map opt+left send_text all \x1bb
map opt+right send_text all \x1bf
map opt+backspace send_text all \x1b\x7f

# ⌘⌫ borra la línea hasta el cursor, como en la Terminal de macOS
# (keyd le deja ⌘ sin traducir a kitty; ver keyd/app.conf).
map cmd+backspace send_text all \x15

# ⌘Q cierra kitty, como en macOS.
map cmd+q quit

# ⌘1…⌘8 van a la pestaña N y ⌘9 a la última, como en la Terminal de macOS.
# (keyd deja pasar ⌘ + número como Super y Cinnamon no usa esos atajos; kitty
# manda a la última cualquier número mayor que las pestañas que hay.)
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 99
